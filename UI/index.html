  </main>
  <script src="./js/api.js"></script>

  <script>
  async function handleRelayCommand(state) {
    const message = document.getElementById("control-message");

    message.textContent = "Procesando comando...";

    try {
      const result = await controlRelay(state);
      message.textContent = "✓ " + result;
    } catch (error) {
      message.textContent = "⚠ " + error.message;
    }
  }


  async function refreshStatus() {
    try {
      const status = await getStatus();

      // Relay state
      const relayStatus = document.getElementById("relay-status");

      relayStatus.textContent = status.relayIsOn
        ? "ENCENDIDO"
        : "APAGADO";

      relayStatus.classList.toggle("on", status.relayIsOn);
      relayStatus.classList.toggle("off", !status.relayIsOn);

      // Control mode
      const modeSelector = document.getElementById("mode-selector");

      if (!changingMode) {
        modeSelector.value = status.mode;
      }

      // Current time
      document.getElementById("current-time").textContent =
        status.timeValid ? status.time : "Sin sincronizar";

      // Schedule status
      document.getElementById("schedule-status").textContent =
        status.scheduleActive ? "ACTIVO" : "INACTIVO";

      // Schedule list
      const scheduleList = document.getElementById("schedule-list");

      scheduleList.replaceChildren();

      status.schedules.forEach((schedule, index) => {
        const row = document.createElement("div");
        row.className = "schedule-row";

        const number = document.createElement("span");
        number.className = "schedule-number";
        number.textContent = String(index + 1).padStart(2, "0");

        const time = document.createElement("div");
        time.className = "schedule-time";

        const start = document.createElement("strong");
        start.textContent = schedule.start;

        const arrow = document.createElement("span");
        arrow.textContent = "→";

        const end = document.createElement("strong");
        end.textContent = schedule.end;

        time.append(start, arrow, end);

        const state = document.createElement("span");
        state.className = "schedule-state";
        state.textContent = "PROGRAMADO";

        row.append(number, time, state);
        scheduleList.appendChild(row);
      });

    } catch (error) {
      console.error("Error al consultar el estado:", error);
    }
  }

  // Initial status and periodic refresh
  refreshStatus();
  setInterval(refreshStatus, 5000);


  let changingMode = false;

  async function changeControlMode() {
    if (changingMode) return;

    const selector = document.getElementById("mode-selector");
    const message = document.getElementById("mode-message");
    const selectedMode = selector.value;

    changingMode = true;
    selector.disabled = true;
    message.textContent = "Aplicando modo...";

    try {
      await setControlMode(selectedMode);

      message.textContent =
        selectedMode === "AUTO"
          ? "Modo automático activado."
          : "Modo manual activado.";

      await refreshStatus();
    } catch (error) {
      message.textContent = `Error: ${error.message}`;
      console.error("Error al cambiar el modo:", error);

      // Recuperar el modo real si el cambio fue rechazado.
      await refreshStatus();
    } finally {
      changingMode = false;
      selector.disabled = false;
    }
  }

  document
    .getElementById("mode-selector")
    .addEventListener("change", changeControlMode);

</script>
